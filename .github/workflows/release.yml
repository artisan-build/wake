name: release-splits

# Lockstep release: a vX.Y.Z tag mirrors packages/wake-contracts,
# packages/wake-client, and packages/wake-server to the future read-only
# artisan-build/wake-contracts, artisan-build/wake-client, and
# artisan-build/wake-server repositories, then applies the same tag to each.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-splits
  cancel-in-progress: false

jobs:
  split:
    name: split packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure split repository authentication
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Split and tag all packages
        env:
          APP_ENV: production
          GH_ORGANIZATION: artisan-build
          GH_USERNAME: x-access-token
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: php artisan kibble:split --tag="${RELEASE_TAG}"
