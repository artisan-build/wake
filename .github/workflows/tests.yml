name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  root:
    name: root / PHP 8.5 / PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_DB: wake_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install pinned DuckDB runtime
        run: composer install:duckdb

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Rector
        run: composer rector:check

      - name: Run Pint
        run: composer test:lint

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: php artisan test

      - name: Run Security Audit
        run: composer audit

  packages:
    name: package / ${{ matrix.package }} / PHP 8.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wake-contracts
          - wake-client
          - wake-server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install package dependencies
        working-directory: packages/${{ matrix.package }}
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        working-directory: packages/${{ matrix.package }}
        run: composer lint:test

      - name: Run PHPStan
        working-directory: packages/${{ matrix.package }}
        run: composer stan

      - name: Run package tests
        working-directory: packages/${{ matrix.package }}
        run: composer test

      - name: Run Security Audit
        working-directory: packages/${{ matrix.package }}
        run: composer audit

  lowest-deps:
    name: tests (lowest deps) / Laravel ${{ matrix.laravel }} / PHP 8.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            testbench: '^9.0'
            pest: '^3.0'
          - laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
          - laravel: '13'
            testbench: '^11.0'
            pest: '^4.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Pin Laravel lane
        working-directory: packages/wake-client
        run: |
          composer config audit.block-insecure false
          composer require \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/log:^${{ matrix.laravel }}.0" \
            "illuminate/queue:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            --no-update --no-interaction
          composer require --dev \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            --no-update --no-interaction

      - name: Install lowest dependencies
        working-directory: packages/wake-client
        run: composer update --prefer-lowest --prefer-stable -W --no-interaction

      - name: Show resolved Laravel version
        working-directory: packages/wake-client
        run: composer show laravel/framework

      - name: Run package tests
        working-directory: packages/wake-client
        run: composer test
